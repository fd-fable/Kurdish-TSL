name: Extract CSTLK text for Stage4 V1

on:
  push:
    branches: [main]
    paths:
      - '0*/CSTLK*.docx'
      - 'Research_Methods/Stage4_V1/tools/extract_cstlk_text.py'
      - '.github/workflows/extract-cstlk-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Run mechanical extraction
        run: python Research_Methods/Stage4_V1/tools/extract_cstlk_text.py

      - name: Commit extracted evidence if changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain Research_Extracts/Stage4_V1)" ]]; then
            git config user.name "kurdish-tsl-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add Research_Extracts/Stage4_V1
            git commit -m "Generate mechanical CSTLK text extracts for Stage4 V1"
            git push
          else
            echo "No extraction changes to commit."
          fi

name: Build comparative research V1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Comparative_Research_V1/tools/**'

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/comparative-convergence-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only comparative evidence needed
        uses: actions/checkout@v4
        with:
          ref: agent/comparative-convergence-v1
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Comparative_Research_V1/**
            /Dictionaries/*/MANIFEST.json
            /Dictionaries/*/LEXICON*.tsv
            /001_MEM_U_ZIN/*.docx
            /001_MEM_U_ZIN/*.md
            /002_ANHA/*.docx
            /002_ANHA/*.md
            /003_RONAHI/*.docx
            /003_RONAHI/*.md
            /004_RUDAW/*.docx
            /004_RUDAW/*.md
            /005_PIRTUKEN_KURMANCI_KATALOG/*.docx
            /005_PIRTUKEN_KURMANCI_KATALOG/*.md
            /006_KURMANJI_BEGINNERS/*.docx
            /006_KURMANJI_BEGINNERS/*.md
            /007_KOVARA_KURMANCI/*.docx
            /007_KOVARA_KURMANCI/*.md
            /008_KOVARA_HAWAR/*.docx
            /008_KOVARA_HAWAR/*.md
            /009_ROJNAMA_KURDISTAN/*.docx
            /009_ROJNAMA_KURDISTAN/*.md
            /010_KOVARA_JIN/*.docx
            /010_KOVARA_JIN/*.md
            /011_FOLKLORA_KURMANCA_1936/*.docx
            /011_FOLKLORA_KURMANCA_1936/*.md
            /012_KURD_TEAVUN_TERAKKI_1908/*.docx
            /012_KURD_TEAVUN_TERAKKI_1908/*.md
            /013_ROJI_KURD_1913/*.docx
            /013_ROJI_KURD_1913/*.md
            /014_DIROK_U_CIVAKA_KURDAN/*.docx
            /014_DIROK_U_CIVAKA_KURDAN/*.md
            /Research_Methods/Stage4_V1/TSLK_INDEPENDENT_AUDIT_FINDINGS.md
      - name: Build named-source comparison
        run: python Comparative_Research_V1/tools/build_comparative_research.py
      - name: Commit generated comparative layer
        run: |
          set -euo pipefail
          git config user.name "kurdish-tsl-comparison-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Comparative_Research_V1
          if ! git diff --cached --quiet; then
            git commit -m "Generate named-source comparative research V1"
            git push origin HEAD:agent/comparative-convergence-v1
          fi

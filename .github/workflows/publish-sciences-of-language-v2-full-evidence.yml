name: Publish Sciences of Language V2 full evidence to Git

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'V2_REPOSITORY_PUBLISH_REQUEST.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: tslk-v2-full-evidence-publish
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/sciences-of-language-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '32224574035'
    steps:
      - name: Checkout V2 feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/sciences-of-language-v2
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Sciences_of_Language_V2/**

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest current-scanner V2 source artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _v2_downloads _v2_artifacts
          mkdir -p _v2_downloads _v2_artifacts/Per_Source
          gh run download "$SOURCE_RUN_ID" --repo '${{ github.repository }}' --pattern 'v2-*' --dir _v2_downloads
          echo "Downloaded artifact directories: $(find _v2_downloads -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - name: Reconstruct source-preserving artifact tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path('_v2_downloads')
          target = Path('_v2_artifacts/Per_Source')
          target.mkdir(parents=True, exist_ok=True)

          corpora = [
              '001_MEM_U_ZIN','002_ANHA','003_RONAHI','004_RUDAW',
              '005_PIRTUKEN_KURMANCI_KATALOG','006_KURMANJI_BEGINNERS',
              '007_KOVARA_KURMANCI','008_KOVARA_HAWAR','009_ROJNAMA_KURDISTAN',
              '010_KOVARA_JIN','011_FOLKLORA_KURMANCA_1936',
              '012_KURD_TEAVUN_TERAKKI_1908','013_ROJI_KURD_1913',
              '014_DIROK_U_CIVAKA_KURDAN'
          ]
          kind_map = {
              'bigram':'BIGRAMS.tsv.gz',
              'trigram':'TRIGRAMS.tsv.gz',
              'fourgram':'FOURGRAMS.tsv.gz',
              'slot':'SLOT_FRAMES.tsv.gz',
              'gap2':'GAP2.tsv.gz',
              'gap3':'GAP3.tsv.gz',
          }

          artifact_dirs = sorted(p for p in source.iterdir() if p.is_dir())
          print(f'Artifact directories discovered: {len(artifact_dirs)}')
          if len(artifact_dirs) != 98:
              raise SystemExit(f'Expected 98 artifact directories, found {len(artifact_dirs)}')

          copied_audits = 0
          copied_patterns = 0
          missing = []

          for corpus in corpora:
              adir = source / f'v2-audit-{corpus}'
              if not adir.is_dir():
                  missing.append(f'artifact:v2-audit-{corpus}')
                  continue
              outdir = target / corpus
              outdir.mkdir(parents=True, exist_ok=True)
              for filename in ['CORPUS_AUDIT.json','POSITION_PROFILES.tsv.gz','MORPH_CONTEXT_PAIR_EVIDENCE.tsv.gz']:
                  candidates = [p for p in adir.rglob(filename) if corpus in p.parts]
                  if len(candidates) != 1:
                      # Fallback to exact-name search when GitHub strips the corpus directory itself.
                      candidates = list(adir.rglob(filename))
                  if len(candidates) != 1:
                      missing.append(f'{adir.name}:{filename}:matches={len(candidates)}')
                      continue
                  shutil.copy2(candidates[0], outdir / filename)
              if (outdir / 'CORPUS_AUDIT.json').exists():
                  copied_audits += 1

              pdir = outdir / 'Patterns'
              pdir.mkdir(parents=True, exist_ok=True)
              for artifact_kind, filename in kind_map.items():
                  p_art = source / f'v2-pattern-{corpus}-{artifact_kind}'
                  if not p_art.is_dir():
                      missing.append(f'artifact:{p_art.name}')
                      continue
                  candidates = [p for p in p_art.rglob(filename) if corpus in p.parts and p.name == filename]
                  if len(candidates) != 1:
                      candidates = [p for p in p_art.rglob(filename) if p.name == filename]
                  if len(candidates) != 1:
                      missing.append(f'{p_art.name}:{filename}:matches={len(candidates)}')
                      continue
                  shutil.copy2(candidates[0], pdir / filename)
                  copied_patterns += 1

          if missing:
              print('Reconstruction problems:')
              for x in missing:
                  print(' -', x)
          print(f'Corpus audits reconstructed: {copied_audits}')
          print(f'Full pattern tables reconstructed: {copied_patterns}')

          actual_audits = len(list(target.glob('*/CORPUS_AUDIT.json')))
          actual_patterns = len(list(target.glob('*/Patterns/*.tsv.gz')))
          if missing or copied_audits != 14 or copied_patterns != 84 or actual_audits != 14 or actual_patterns != 84:
              raise SystemExit('Artifact reconstruction gate failed')
          print('Artifact tree complete: 14 audits / 84 full pattern tables / 14 corpora.')
          PY

      - name: Re-aggregate current V2 and publish all full source pattern tables
        shell: bash
        run: |
          set -euo pipefail
          python Sciences_of_Language_V2/tools/aggregate_v2.py \
            --artifacts-root _v2_artifacts \
            --output-root Sciences_of_Language_V2
          python Sciences_of_Language_V2/tools/publish_full_patterns.py \
            --artifacts-root _v2_artifacts \
            --output-root Sciences_of_Language_V2
          cat Sciences_of_Language_V2/SCIENCES_OF_LANGUAGE_V2_MANIFEST.json
          cat Sciences_of_Language_V2/FULL_PATTERN_REPOSITORY_MANIFEST.json | head -80
          test "$(find Sciences_of_Language_V2/Per_Source -path '*/Patterns/*.tsv.gz' | wc -l)" -eq 84
          find Sciences_of_Language_V2 -type f -size +95M -print -quit | grep -q . && { echo 'ERROR: GitHub file >95M'; exit 1; } || true

      - name: Commit complete V2 evidence to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kurdish-tsl-v2-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Sciences_of_Language_V2
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m 'Publish complete Sciences of Language V2 source evidence in Git'
            git push origin HEAD:agent/sciences-of-language-v2
          fi

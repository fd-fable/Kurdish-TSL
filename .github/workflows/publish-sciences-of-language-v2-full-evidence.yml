name: Publish Sciences of Language V2 full evidence to Git

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'V2_REPOSITORY_PUBLISH_REQUEST.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: tslk-v2-full-evidence-publish
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/sciences-of-language-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '32224574035'
    steps:
      - name: Checkout V2 feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/sciences-of-language-v2
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Sciences_of_Language_V2/**

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest current-scanner V2 source artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _v2_downloads _v2_artifacts
          mkdir -p _v2_downloads _v2_artifacts/Per_Source
          gh run download "$SOURCE_RUN_ID" --repo '${{ github.repository }}' --pattern 'v2-*' --dir _v2_downloads
          echo "Downloaded artifact directories: $(find _v2_downloads -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - name: Reconstruct source-preserving artifact tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path('_v2_downloads')
          target = Path('_v2_artifacts/Per_Source')
          target.mkdir(parents=True, exist_ok=True)

          copied = 0
          for f in source.rglob('*'):
              if not f.is_file():
                  continue
              parts = f.parts
              try:
                  i = parts.index('Per_Source')
              except ValueError:
                  continue
              rel = Path(*parts[i + 1:])
              if not rel.parts:
                  continue
              dst = target / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(f, dst)
              copied += 1

          audits = sorted(target.rglob('CORPUS_AUDIT.json'))
          patterns = sorted(target.glob('*/Patterns/*.tsv.gz'))
          corpora = sorted({p.parent.parent.name for p in patterns})
          print(f'Files copied from source-preserving paths: {copied}')
          print(f'Corpus audits reconstructed: {len(audits)}')
          print(f'Full pattern tables reconstructed: {len(patterns)}')
          print(f'Corpora represented by pattern tables: {len(corpora)}')
          print('Corpora:', ', '.join(corpora))

          expected_corpora = {
              '001_MEM_U_ZIN','002_ANHA','003_RONAHI','004_RUDAW',
              '005_PIRTUKEN_KURMANCI_KATALOG','006_KURMANJI_BEGINNERS',
              '007_KOVARA_KURMANCI','008_KOVARA_HAWAR','009_ROJNAMA_KURDISTAN',
              '010_KOVARA_JIN','011_FOLKLORA_KURMANCA_1936',
              '012_KURD_TEAVUN_TERAKKI_1908','013_ROJI_KURD_1913',
              '014_DIROK_U_CIVAKA_KURDAN'
          }
          actual_corpora = set(corpora)
          missing = sorted(expected_corpora - actual_corpora)
          unexpected = sorted(actual_corpora - expected_corpora)
          if missing:
              print('Missing corpora:', missing)
          if unexpected:
              print('Unexpected corpora:', unexpected)

          kinds = {'BIGRAMS','TRIGRAMS','FOURGRAMS','SLOT_FRAMES','GAP2','GAP3'}
          missing_tables = []
          for corpus in sorted(expected_corpora):
              pdir = target / corpus / 'Patterns'
              for kind in sorted(kinds):
                  if not (pdir / f'{kind}.tsv.gz').exists():
                      missing_tables.append(f'{corpus}/{kind}')
          if missing_tables:
              print('Missing pattern tables:', missing_tables)

          if len(audits) != 14 or len(patterns) != 84 or missing or unexpected or missing_tables:
              raise SystemExit('Artifact reconstruction gate failed')
          print('Artifact tree complete: 14 audits / 84 full pattern tables / 14 corpora.')
          PY

      - name: Re-aggregate current V2 and publish all full source pattern tables
        shell: bash
        run: |
          set -euo pipefail
          python Sciences_of_Language_V2/tools/aggregate_v2.py \
            --artifacts-root _v2_artifacts \
            --output-root Sciences_of_Language_V2
          python Sciences_of_Language_V2/tools/publish_full_patterns.py \
            --artifacts-root _v2_artifacts \
            --output-root Sciences_of_Language_V2
          cat Sciences_of_Language_V2/SCIENCES_OF_LANGUAGE_V2_MANIFEST.json
          cat Sciences_of_Language_V2/FULL_PATTERN_REPOSITORY_MANIFEST.json | head -80
          test "$(find Sciences_of_Language_V2/Per_Source -path '*/Patterns/*.tsv.gz' | wc -l)" -eq 84
          find Sciences_of_Language_V2 -type f -size +95M -print -quit | grep -q . && { echo 'ERROR: GitHub file >95M'; exit 1; } || true

      - name: Commit complete V2 evidence to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kurdish-tsl-v2-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Sciences_of_Language_V2
          if git diff --cached --quiet; then
            echo 'No publication changes.'
          else
            git commit -m 'Publish complete Sciences of Language V2 source evidence in Git'
            git push origin HEAD:agent/sciences-of-language-v2
          fi

name: Build Sciences of Language V2 full occurrence reconstruction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'Sciences_of_Language_V2/**'
      - 'V2_Build_Request.md'
      - '.github/workflows/build-sciences-of-language-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tslk-sciences-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-corpus:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/sciences-of-language-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        corpus:
          - 001_MEM_U_ZIN
          - 002_ANHA
          - 003_RONAHI
          - 004_RUDAW
          - 005_PIRTUKEN_KURMANCI_KATALOG
          - 006_KURMANJI_BEGINNERS
          - 007_KOVARA_KURMANCI
          - 008_KOVARA_HAWAR
          - 009_ROJNAMA_KURDISTAN
          - 010_KOVARA_JIN
          - 011_FOLKLORA_KURMANCA_1936
          - 012_KURD_TEAVUN_TERAKKI_1908
          - 013_ROJI_KURD_1913
          - 014_DIROK_U_CIVAKA_KURDAN
    steps:
      - name: Checkout only this corpus occurrence evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Sciences_of_Language_V2/**
            /Dictionaries/${{ matrix.corpus }}/Occurrences/**
            /Dictionaries/${{ matrix.corpus }}/MANIFEST.json
            /Comparative_Research_V1/Data/LETTER_BEARING_CROSS_SOURCE_INDEX.tsv.gz
            /Sciences_of_Language_V1/Data/FORM_FAMILY_CANDIDATES.tsv.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan every occurrence and build position/morphology context evidence
        run: |
          python Sciences_of_Language_V2/tools/v2_corpus_scan.py \
            --repo-root . \
            --corpus '${{ matrix.corpus }}' \
            --out-dir 'Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}' \
            --mode audit
      - name: Upload corpus audit package
        uses: actions/upload-artifact@v4
        with:
          name: v2-audit-${{ matrix.corpus }}
          path: Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  pattern-corpus:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/sciences-of-language-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        corpus:
          - 001_MEM_U_ZIN
          - 002_ANHA
          - 003_RONAHI
          - 004_RUDAW
          - 005_PIRTUKEN_KURMANCI_KATALOG
          - 006_KURMANJI_BEGINNERS
          - 007_KOVARA_KURMANCI
          - 008_KOVARA_HAWAR
          - 009_ROJNAMA_KURDISTAN
          - 010_KOVARA_JIN
          - 011_FOLKLORA_KURMANCA_1936
          - 012_KURD_TEAVUN_TERAKKI_1908
          - 013_ROJI_KURD_1913
          - 014_DIROK_U_CIVAKA_KURDAN
        kind: [bigram, trigram, fourgram, slot, gap2, gap3]
    steps:
      - name: Checkout only this corpus occurrence evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Sciences_of_Language_V2/**
            /Dictionaries/${{ matrix.corpus }}/Occurrences/**
            /Dictionaries/${{ matrix.corpus }}/MANIFEST.json
            /Comparative_Research_V1/Data/LETTER_BEARING_CROSS_SOURCE_INDEX.tsv.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate recurrent pattern table
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p 'Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}/Patterns'
          K='${{ matrix.kind }}'
          case "$K" in
            bigram) OUT=BIGRAMS; MODE=emit-bigram; FORMAT='format-counts'; KIND=bigram ;;
            trigram) OUT=TRIGRAMS; MODE=emit-trigram; FORMAT='format-counts'; KIND=trigram ;;
            fourgram) OUT=FOURGRAMS; MODE=emit-fourgram; FORMAT='format-counts'; KIND=fourgram ;;
            gap2) OUT=GAP2; MODE=emit-gap2; FORMAT='format-counts'; KIND=gap2 ;;
            gap3) OUT=GAP3; MODE=emit-gap3; FORMAT='format-counts'; KIND=gap3 ;;
            slot) OUT=SLOT_FRAMES; MODE=emit-slot; FORMAT='format-slot'; KIND='' ;;
            *) exit 2 ;;
          esac
          if [[ "$FORMAT" == 'format-slot' ]]; then
            python Sciences_of_Language_V2/tools/v2_corpus_scan.py --repo-root . --corpus '${{ matrix.corpus }}' --mode "$MODE" \
              | sort -S 55% --parallel=2 \
              | uniq -c \
              | python Sciences_of_Language_V2/tools/v2_corpus_scan.py --repo-root . --mode format-slot \
              | gzip -9 > "Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}/Patterns/${OUT}.tsv.gz"
          else
            python Sciences_of_Language_V2/tools/v2_corpus_scan.py --repo-root . --corpus '${{ matrix.corpus }}' --mode "$MODE" \
              | sort -S 55% --parallel=2 \
              | uniq -c \
              | python Sciences_of_Language_V2/tools/v2_corpus_scan.py --repo-root . --mode format-counts --kind "$KIND" --min-count 2 \
              | gzip -9 > "Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}/Patterns/${OUT}.tsv.gz"
          fi
          gzip -t "Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}/Patterns/${OUT}.tsv.gz"
          ls -lh "Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}/Patterns/${OUT}.tsv.gz"
      - name: Upload pattern package
        uses: actions/upload-artifact@v4
        with:
          name: v2-pattern-${{ matrix.corpus }}-${{ matrix.kind }}
          path: Sciences_of_Language_V2/Per_Source/${{ matrix.corpus }}/Patterns
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  aggregate:
    needs: [audit-corpus, pattern-corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout V2 branch code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Sciences_of_Language_V2/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and merge all corpus V2 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v2-*
          path: _v2_artifacts
          merge-multiple: true
      - name: Aggregate cross-source reconstruction and build Language Graph V2
        run: |
          python Sciences_of_Language_V2/tools/aggregate_v2.py \
            --artifacts-root _v2_artifacts \
            --output-root Sciences_of_Language_V2
          cat Sciences_of_Language_V2/SCIENCES_OF_LANGUAGE_V2_MANIFEST.json
          sed -n '1,260p' Sciences_of_Language_V2/TSLK_SCIENCES_OF_LANGUAGE_REPORT_V2.md
          du -sh Sciences_of_Language_V2
          find Sciences_of_Language_V2 -type f -size +95M -print -quit | grep -q . && { echo 'ERROR: GitHub file >95M'; exit 1; } || true
      - name: Commit generated V2 evidence to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kurdish-tsl-v2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Sciences_of_Language_V2
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Sciences of Language V2 full-occurrence reconstruction'
            if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
              git push origin 'HEAD:${{ github.event.pull_request.head.ref }}'
            else
              git push
            fi
          fi

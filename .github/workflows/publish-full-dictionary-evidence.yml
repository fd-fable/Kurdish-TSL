name: Publish full dictionary evidence into Git repository

on:
  push:
    branches:
      - agent/full-dictionary-evidence-v1
    paths:
      - 'FULL_DICTIONARY_GITHUB_PUBLISH_REQUEST.md'
      - '.github/workflows/publish-full-dictionary-evidence.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: tslk-full-dictionary-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-full-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/full-dictionary-evidence-v1

      - name: Download validated full dictionary evidence
        uses: actions/download-artifact@v4
        with:
          name: TSLK_DEEP_DICTIONARY_FULL_EVIDENCE_V1
          path: _full_evidence
          repository: fd-fable/Kurdish-TSL
          run-id: 32168308087
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install occurrence shards into repository tree and verify
        shell: bash
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          download_root = Path('_full_evidence')
          candidates = [
              download_root / '_dict_artifacts',
              download_root,
          ]
          source_root = next((p for p in candidates if any(p.glob('dict-*'))), None)
          if source_root is None:
              found = sorted(str(p) for p in download_root.rglob('dict-*') if p.is_dir())
              if found:
                  source_root = Path(found[0]).parent
              else:
                  raise SystemExit('Could not locate dict-* evidence directories in downloaded artifact')

          repo_root = Path('Dictionaries')
          corpora = sorted(p for p in source_root.glob('dict-*') if p.is_dir())
          if len(corpora) != 14:
              raise SystemExit(f'Expected 14 evidence directories, found {len(corpora)} under {source_root}')

          total_expected_shards = 0
          total_copied_shards = 0
          largest = (0, None)
          summary = []

          for src in corpora:
              corpus = src.name.removeprefix('dict-')
              dest = repo_root / corpus
              manifest_path = dest / 'MANIFEST.json'
              if not manifest_path.exists():
                  raise SystemExit(f'Missing repository manifest: {manifest_path}')
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              expected = int(manifest['counts']['occurrence_shards'])
              source_files = sorted(src.glob('OCCURRENCES_*.tsv.gz'))
              if len(source_files) != expected:
                  raise SystemExit(f'{corpus}: source occurrence shard count {len(source_files)} != manifest expected {expected}')

              occ_dir = dest / 'Occurrences'
              if occ_dir.exists():
                  shutil.rmtree(occ_dir)
              occ_dir.mkdir(parents=True, exist_ok=True)

              for f in source_files:
                  out = occ_dir / f.name
                  shutil.copy2(f, out)
                  size = out.stat().st_size
                  if size >= 95 * 1024 * 1024:
                      raise SystemExit(f'{corpus}: file too large for ordinary GitHub Git: {out} = {size} bytes')
                  if size > largest[0]:
                      largest = (size, out)

              copied = sorted(occ_dir.glob('OCCURRENCES_*.tsv.gz'))
              if len(copied) != expected:
                  raise SystemExit(f'{corpus}: copied occurrence shard count {len(copied)} != expected {expected}')

              total_expected_shards += expected
              total_copied_shards += len(copied)
              manifest['repository_core']['occurrence_files_committed_to_git'] = True
              manifest['repository_core']['storage_model'] = 'Git-tracked exhaustive vocabulary core plus complete occurrence concordance shards'
              manifest['files']['occurrence_shards'] = {
                  'directory': 'Occurrences',
                  'pattern': 'OCCURRENCES_*.tsv.gz',
                  'count': expected,
              }
              manifest['full_evidence_artifact']['preservation_note'] = 'Backup artifact retained; complete occurrence shards are also committed in Dictionaries/<corpus>/Occurrences/.'
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

              readme = dest / 'README.md'
              text = readme.read_text(encoding='utf-8')
              note = (
                  '\n## Full evidence now stored in GitHub repository\n\n'
                  f'This corpus has **{expected}** complete compressed occurrence/concordance shard(s) committed under `Occurrences/`. '
                  'The GitHub Actions artifact remains only as a backup copy. No vocabulary or occurrence shard is intentionally omitted from the repository package.\n'
              )
              if '## Full evidence now stored in GitHub repository' not in text:
                  readme.write_text(text.rstrip() + '\n' + note, encoding='utf-8')
              summary.append((corpus, expected))

          if total_expected_shards != total_copied_shards:
              raise SystemExit(f'Global shard mismatch expected={total_expected_shards} copied={total_copied_shards}')

          master_path = repo_root / 'DICTIONARY_BUILD_MANIFEST.json'
          master = json.loads(master_path.read_text(encoding='utf-8'))
          master['repository_storage'] = 'sharded exhaustive lexicon core plus complete compressed occurrence concordance shards'
          master['full_occurrence_storage'] = 'Git repository Dictionaries/<corpus>/Occurrences/; GitHub Actions artifact retained as backup'
          master['all_occurrence_shards_committed_to_git'] = True
          master['total_occurrence_shards_committed'] = total_copied_shards
          master_path.write_text(json.dumps(master, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          index = repo_root / 'INDEX.md'
          idx = index.read_text(encoding='utf-8')
          old = (
              'The full 47.6M-occurrence concordance streams are not committed to ordinary Git because the combined evidence pack is ~1.8 GB. '
              'Each per-corpus `MANIFEST.json` records the validated source-run artifact ID and SHA-256. This is a storage separation only: no vocabulary entries are omitted from the Git-tracked lexicons.'
          )
          new = (
              'The complete 47.6M-occurrence concordance is now stored directly in this GitHub repository as compressed per-corpus shards under '
              '`Dictionaries/<CORPUS>/Occurrences/OCCURRENCES_*.tsv.gz`. The 1.8-GB GitHub Actions artifact remains as a backup copy. '
              'Large lexicons remain row-sharded so every ordinary Git file stays below GitHub file-size limits.'
          )
          if old in idx:
              idx = idx.replace(old, new)
          elif new not in idx:
              idx = idx.rstrip() + '\n\n## Repository occurrence evidence\n\n' + new + '\n'
          index.write_text(idx, encoding='utf-8')

          print(f'Validated corpora: {len(summary)}')
          print(f'Total occurrence shards copied: {total_copied_shards}')
          print(f'Largest occurrence shard: {largest[0]} bytes :: {largest[1]}')
          for corpus, count in summary:
              print(f'{corpus}: {count} shard(s)')
          PY

          echo 'Evidence tree size:'
          du -sh Dictionaries
          echo 'Largest occurrence files:'
          find Dictionaries -path '*/Occurrences/*.tsv.gz' -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Commit and push full evidence in small batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kurdish-tsl-dictionary-bot"
          git config user.email "actions@users.noreply.github.com"

          mapfile -t files < <(find Dictionaries -path '*/Occurrences/*.tsv.gz' -type f | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No occurrence files found to publish.'
            exit 1
          fi

          batch_size=10
          batch_no=0
          batch=()
          for f in "${files[@]}"; do
            batch+=("$f")
            if [[ ${#batch[@]} -ge $batch_size ]]; then
              batch_no=$((batch_no+1))
              git add -- "${batch[@]}"
              git commit -m "Add full dictionary occurrence evidence batch ${batch_no}"
              git push origin HEAD:agent/full-dictionary-evidence-v1
              batch=()
            fi
          done

          if [[ ${#batch[@]} -gt 0 ]]; then
            batch_no=$((batch_no+1))
            git add -- "${batch[@]}"
            git commit -m "Add full dictionary occurrence evidence batch ${batch_no}"
            git push origin HEAD:agent/full-dictionary-evidence-v1
          fi

          git add Dictionaries/INDEX.md Dictionaries/DICTIONARY_BUILD_MANIFEST.json Dictionaries/*/MANIFEST.json Dictionaries/*/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Mark full dictionary occurrence evidence as repository-resident"
            git push origin HEAD:agent/full-dictionary-evidence-v1
          fi

          echo "Published ${#files[@]} occurrence files in ${batch_no} data batches."

      - name: Final repository verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('Dictionaries')
          master = json.loads((root / 'DICTIONARY_BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          if not master.get('all_occurrence_shards_committed_to_git'):
              raise SystemExit('Master manifest does not certify repository occurrence storage')
          total = 0
          for manifest_path in sorted(root.glob('*/MANIFEST.json')):
              m = json.loads(manifest_path.read_text(encoding='utf-8'))
              corpus = m['corpus_folder']
              expected = int(m['counts']['occurrence_shards'])
              actual = len(list((root / corpus / 'Occurrences').glob('OCCURRENCES_*.tsv.gz')))
              if actual != expected:
                  raise SystemExit(f'{corpus}: final shard mismatch actual={actual} expected={expected}')
              if not m['repository_core'].get('occurrence_files_committed_to_git'):
                  raise SystemExit(f'{corpus}: repository manifest flag is false')
              total += actual
          if total != int(master['total_occurrence_shards_committed']):
              raise SystemExit(f'Final total mismatch {total} != {master["total_occurrence_shards_committed"]}')
          print(f'FINAL PASS: {total} complete occurrence shards present in repository working tree across 14 corpora.')
          PY

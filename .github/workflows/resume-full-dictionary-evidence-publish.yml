name: Resume full dictionary evidence publication

on:
  pull_request:
    branches: [main]
    paths:
      - 'FULL_DICTIONARY_GITHUB_RESUME_REQUEST.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: tslk-full-dictionary-evidence-publication
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/full-dictionary-evidence-v1

      - name: Download validated evidence backup
        uses: actions/download-artifact@v4
        with:
          name: TSLK_DEEP_DICTIONARY_FULL_EVIDENCE_V1
          path: _full_evidence
          repository: fd-fable/Kurdish-TSL
          run-id: 32168308087
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore complete occurrence tree and verify source counts
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          d = Path('_full_evidence')
          roots = [d / '_dict_artifacts', d]
          srcroot = next((p for p in roots if any(p.glob('dict-*'))), None)
          if srcroot is None:
              found = sorted(p for p in d.rglob('dict-*') if p.is_dir())
              if not found:
                  raise SystemExit('No dict-* directories found in evidence artifact')
              srcroot = found[0].parent

          corpora = sorted(p for p in srcroot.glob('dict-*') if p.is_dir())
          if len(corpora) != 14:
              raise SystemExit(f'Expected 14 corpora, found {len(corpora)}')

          total = 0
          largest = (0, '')
          for src in corpora:
              corpus = src.name.removeprefix('dict-')
              dest = Path('Dictionaries') / corpus
              manifest = json.loads((dest / 'MANIFEST.json').read_text(encoding='utf-8'))
              expected = int(manifest['counts']['occurrence_shards'])
              files = sorted(src.glob('OCCURRENCES_*.tsv.gz'))
              if len(files) != expected:
                  raise SystemExit(f'{corpus}: source={len(files)} expected={expected}')
              occ = dest / 'Occurrences'
              occ.mkdir(parents=True, exist_ok=True)
              for f in files:
                  out = occ / f.name
                  if not out.exists() or out.stat().st_size != f.stat().st_size:
                      shutil.copy2(f, out)
                  size = out.stat().st_size
                  if size >= 95 * 1024 * 1024:
                      raise SystemExit(f'{out}: {size} bytes exceeds safe ordinary-Git limit')
                  if size > largest[0]:
                      largest = (size, str(out))
              actual = len(list(occ.glob('OCCURRENCES_*.tsv.gz')))
              if actual != expected:
                  raise SystemExit(f'{corpus}: restored={actual} expected={expected}')
              total += actual
          print(f'RESTORE PASS: {total} occurrence shards across 14 corpora')
          print(f'Largest shard: {largest[0]} bytes :: {largest[1]}')
          PY

      - name: Push only missing occurrence files in three-file batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kurdish-tsl-dictionary-bot"
          git config user.email "actions@users.noreply.github.com"

          mapfile -t missing < <(
            find Dictionaries -path '*/Occurrences/*.tsv.gz' -type f | sort | while read -r f; do
              if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                printf '%s\n' "$f"
              fi
            done
          )

          echo "Missing occurrence files at resume start: ${#missing[@]}"
          batch_size=3
          batch_no=0
          batch=()
          for f in "${missing[@]}"; do
            batch+=("$f")
            if [[ ${#batch[@]} -ge $batch_size ]]; then
              batch_no=$((batch_no+1))
              git add -- "${batch[@]}"
              git commit -m "Resume full dictionary evidence batch ${batch_no}"
              git push origin HEAD:agent/full-dictionary-evidence-v1
              batch=()
            fi
          done
          if [[ ${#batch[@]} -gt 0 ]]; then
            batch_no=$((batch_no+1))
            git add -- "${batch[@]}"
            git commit -m "Resume full dictionary evidence batch ${batch_no}"
            git push origin HEAD:agent/full-dictionary-evidence-v1
          fi
          echo "Resume data batches pushed: ${batch_no}"

      - name: Update manifests only after all occurrence files are pushed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('Dictionaries')
          total = 0
          manifests = sorted(root.glob('*/MANIFEST.json'))
          if len(manifests) != 14:
              raise SystemExit(f'Expected 14 manifests, found {len(manifests)}')

          for mp in manifests:
              m = json.loads(mp.read_text(encoding='utf-8'))
              corpus = m['corpus_folder']
              expected = int(m['counts']['occurrence_shards'])
              occ = root / corpus / 'Occurrences'
              actual = len(list(occ.glob('OCCURRENCES_*.tsv.gz')))
              if actual != expected:
                  raise SystemExit(f'{corpus}: local occurrence count={actual} expected={expected}')
              total += actual
              m['repository_core']['occurrence_files_committed_to_git'] = True
              m['repository_core']['storage_model'] = 'Git-tracked exhaustive vocabulary core plus complete occurrence concordance shards'
              m['files']['occurrence_shards'] = {'directory':'Occurrences','pattern':'OCCURRENCES_*.tsv.gz','count':expected}
              m['full_evidence_artifact']['preservation_note'] = 'Backup artifact retained; complete occurrence shards are also committed in Dictionaries/<corpus>/Occurrences/.'
              mp.write_text(json.dumps(m, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

              rp = root / corpus / 'README.md'
              text = rp.read_text(encoding='utf-8')
              if '## Full evidence now stored in GitHub repository' not in text:
                  text = text.rstrip() + f'\n\n## Full evidence now stored in GitHub repository\n\nThis corpus has **{expected}** complete compressed occurrence/concordance shard(s) under `Occurrences/`. The Actions artifact remains as backup.\n'
                  rp.write_text(text, encoding='utf-8')

          master_path = root / 'DICTIONARY_BUILD_MANIFEST.json'
          master = json.loads(master_path.read_text(encoding='utf-8'))
          master['repository_storage'] = 'sharded exhaustive lexicon core plus complete compressed occurrence concordance shards'
          master['full_occurrence_storage'] = 'Git repository Dictionaries/<corpus>/Occurrences/; GitHub Actions artifact retained as backup'
          master['all_occurrence_shards_committed_to_git'] = True
          master['total_occurrence_shards_committed'] = total
          master_path.write_text(json.dumps(master, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          index = root / 'INDEX.md'
          idx = index.read_text(encoding='utf-8')
          old = 'The full 47.6M-occurrence concordance streams are not committed to ordinary Git because the combined evidence pack is ~1.8 GB. Each per-corpus `MANIFEST.json` records the validated source-run artifact ID and SHA-256. This is a storage separation only: no vocabulary entries are omitted from the Git-tracked lexicons.'
          new = 'The complete 47.6M-occurrence concordance is stored directly in this GitHub repository as compressed per-corpus shards under `Dictionaries/<CORPUS>/Occurrences/OCCURRENCES_*.tsv.gz`. The Actions artifact remains as a backup. Large lexicons remain row-sharded so every ordinary Git file stays below GitHub file-size limits.'
          if old in idx:
              idx = idx.replace(old, new)
          elif new not in idx:
              idx = idx.rstrip() + '\n\n## Repository occurrence evidence\n\n' + new + '\n'
          index.write_text(idx, encoding='utf-8')
          print(f'MANIFEST PASS: {total} occurrence shards')
          PY

          git add Dictionaries/INDEX.md Dictionaries/DICTIONARY_BUILD_MANIFEST.json Dictionaries/*/MANIFEST.json Dictionaries/*/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Certify full dictionary evidence as repository-resident"
            git push origin HEAD:agent/full-dictionary-evidence-v1
          fi

      - name: Final remote verification
        shell: bash
        run: |
          git fetch origin agent/full-dictionary-evidence-v1
          git reset --hard origin/agent/full-dictionary-evidence-v1
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('Dictionaries')
          master = json.loads((root/'DICTIONARY_BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          if not master.get('all_occurrence_shards_committed_to_git'):
              raise SystemExit('Master certification flag false')
          total = 0
          for mp in sorted(root.glob('*/MANIFEST.json')):
              m = json.loads(mp.read_text(encoding='utf-8'))
              c = m['corpus_folder']
              expected = int(m['counts']['occurrence_shards'])
              actual = len(list((root/c/'Occurrences').glob('OCCURRENCES_*.tsv.gz')))
              if actual != expected or not m['repository_core'].get('occurrence_files_committed_to_git'):
                  raise SystemExit(f'{c}: final verification failed actual={actual} expected={expected}')
              total += actual
          if total != int(master['total_occurrence_shards_committed']):
              raise SystemExit(f'Global total mismatch {total}')
          print(f'FINAL REMOTE PASS: {total} occurrence shards physically present on safety branch.')
          PY

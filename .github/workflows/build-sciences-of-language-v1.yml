name: Build Sciences of Language V1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Sciences_of_Language_V1/tools/**'

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/sciences-of-language-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout structural evidence only
        uses: actions/checkout@v4
        with:
          ref: agent/sciences-of-language-v1
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Sciences_of_Language_V1/**
            /Dictionaries/*/LEXICON*.tsv
            /Dictionaries/*/MANIFEST.json
            /Comparative_Research_V1/Data/LETTER_BEARING_CROSS_SOURCE_INDEX.tsv.gz
            /Comparative_Research_V1/COMPARATIVE_AUDIT_MANIFEST.json
      - name: Build Sciences of Language V1
        run: python Sciences_of_Language_V1/tools/build_sciences_of_language_v1.py
      - name: Commit generated language-science layer
        run: |
          set -euo pipefail
          git config user.name "kurdish-tsl-language-science-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sciences_of_Language_V1
          if ! git diff --cached --quiet; then
            git commit -m "Generate Sciences of Language structural model V1"
            git push origin HEAD:agent/sciences-of-language-v1
          fi
